services:

  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: ticketing
    ports:
      - "55432:5432"

  redis:
    image: redis:7
    ports:
      - "56379:6379"

  kafka:
    image: apache/kafka:4.0.1
    ports:
      - "59092:9092"

  api:
    build: .
    ports:
      - "58080:8080"
    depends_on:
      - postgres
      - redis
      - kafka