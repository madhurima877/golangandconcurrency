services:
  postgres:
    image: postgres:17
    container_name: product-postgres
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin
      POSTGRES_DB: products
    ports:
      - "15433:5432"
    volumes:
      - product_pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7
    container_name: product-redis
    ports:
      - "16380:6379"

volumes:
  product_pgdata: